<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>selftest-booting</title>
<base href="../">
<link rel="stylesheet" href="../assets/css/screen.css">
</head>
<body>
<div id="game-frame"><div id="game-root"></div></div>
<script src="../tools/selftest.js"></script>
<script src="../game-config.js"></script>
<script src="../src/core/sdk.js"></script>
<script src="../src/core/assets.js"></script>
<script src="../src/core/storage.js"></script>
<script src="../src/core/audio.js"></script>
<script src="../src/core/input.js"></script>
<script src="../src/core/level-gen.js"></script>
<script src="../src/core/screen-manager.js"></script>
<script src="../src/core/game.js"></script>
<script src="../src/screens/base-screen.js"></script>
<script src="../src/ui/ui-kit.js"></script>
<script src="../src/screens/loading-screen.js"></script>
<script src="../src/screens/menu-screen.js"></script>
<script src="../src/screens/gameplay-screen.js"></script>
<script src="../src/screens/gameover-screen.js"></script>
<script src="../src/screens/victory-screen.js"></script>
<script src="../src/screens/shop-screen.js"></script>
<script src="../src/main.js"></script>
<script>
SDK.init().then(() => game.storage.loadCloud()).catch(() => {}).finally(() => {
  game.start();
  window.__SELFTEST_RUN(game).then(() => {
    const ok = window.__T.fails.length === 0 && window.__T.errors.length === 0;
    document.title = ok ? 'SELFTEST-PASS' : 'SELFTEST-FAIL';
    console.log('SELFTEST-RESULT:' + JSON.stringify({ ok, fails: window.__T.fails }));
  });
});
</script>
</body>
</html>
